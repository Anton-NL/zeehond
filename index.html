<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dff5f2">
  <title>Zeehondje van de dag 🦭</title>
  
  <style>
    :root { color-scheme: light; --ink:#173b43; --sea:#dff5f2; --blue:#83d5d0; --coral:#ffb6a2; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:28px 16px;
      font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif; color:var(--ink);
      background: radial-gradient(circle at 15% 15%, #fff9df 0 8%, transparent 30%),
                  radial-gradient(circle at 85% 80%, #b8e9e6 0 10%, transparent 34%), var(--sea);
    }
    main { width:min(760px,100%); text-align:center; }
    .tag { display:inline-block; padding:8px 14px; border-radius:999px; background:#ffffffb8; font-size:.9rem; }
    h1 { font-size:clamp(2rem,6vw,3.6rem); line-height:1.05; margin:18px 0 10px; letter-spacing:-.04em; }
    .intro { font-size:1.08rem; line-height:1.6; max-width:520px; margin:0 auto 24px; }
    .seal-button {
      border:0; padding:0; width:clamp(190px,45vw,280px); aspect-ratio:1; border-radius:50%;
      cursor:pointer; position:relative; overflow:hidden; background:white;
      box-shadow:0 12px 0 #9bd8d1, 0 20px 35px #1d687522;
      outline:5px solid #fff; transition:transform .18s ease, box-shadow .18s ease;
    }
    .seal-button:hover { transform:translateY(-5px) rotate(-2deg); box-shadow:0 17px 0 #9bd8d1, 0 25px 35px #1d687522; }
    .seal-button:active { transform:translateY(3px) scale(.98); box-shadow:0 7px 0 #9bd8d1, 0 12px 20px #1d687522; }
    .seal-button img { width:100%; height:100%; object-fit:cover; object-position:center 38%; }
    .button-label { margin:24px 0 8px; font-size:1.15rem; font-weight:800; }
    .hint { margin:0 0 26px; color:#42656a; font-size:.94rem; }

.video-card {
  display: none;
}

.video-card.visible {
  display: flex;
  position: fixed;
  inset: 0;
  z-index: 9999;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: #000;
  align-items: center;
  justify-content: center;
}

.video-title,
.another {
  display: none;
}

.shorts-player {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #000;
}

.shorts-player iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

.close-video {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 10001;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: #ffffffdd;
  color: #222;
  font-size: 24px;
  cursor: pointer;
}

    .another { display:block; margin:16px auto 2px; padding:12px 18px; border:0; border-radius:999px; background:var(--coral); color:#542d29; font-weight:800; font-size:1rem; cursor:pointer; }
    .another:hover { filter:brightness(.97); transform:translateY(-1px); }
    footer { margin-top:28px; font-size:.8rem; color:#557579; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none!important; transition:none!important; } }
  </style>
</head>
<body>
  <main>
    <span class="tag">🦭 jouw dagelijkse dosis zeehond</span>
    <h1>Zeehondje van de dag</h1>
    <p class="intro">Even behoefte aan een zeehond? Klik op het hoofd hieronder en laat het internet je verrassen.</p>

    <button class="seal-button" id="sealButton" aria-label="Toon een willekeurig zeehondfilmpje">
      <img src="zeehond.jpg" alt="Close-up van een nieuwsgierige zeehond">
    </button>
    <p class="button-label">👆 Klik op mijn hoofdje!</p>
    <p class="hint">Elke klik = een nieuw zeehondfilmpje.</p>


<section class="video-card" id="videoCard" aria-live="polite">
  <button class="close-video" id="closeVideo" aria-label="Video sluiten">✕</button>
  <div class="video-title" id="videoTitle">Jouw zeehondfilmpje 🫧</div>
  <div class="shorts-player" id="player"></div>
  <button class="another" id="anotherButton">Nog een zeehond! 🦭</button>
</section>

    <footer>Gemaakt met liefde voor zeehonden.</footer>
  </main>




<script>
  const SUPABASE_URL = "https://mfbcphtsirtnktvtwxgt.supabase.co";
const FUNCTION_NAME = "track-seal-event-";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_SFamWrcarFcRO_92pz6BBg_-27LbBj_";
  
  
const videos = [
  { id: "Xa-8suehHSY", title: "Im so in love with you" },
  { id: "4yfFy8HF8WE", title: "Kusjesss" },
  { id: "JazJHqyevRI", title: "Seal Core" },
  { id: "CkAywv7LQys", title: "Flipper" },
  { id: "fyuxfbphKlc", title: "Beat It" },
  { id: "zZwxyejVibI", title: "PingpNg" },
  { id: "Rv5d8r4dTiU", title: "Roepen" },
  { id: "r2zYeG9HyNk", title: "Mi Pan" },
  { id: "jniQ4bwKE6Y", title: "Cute baby" },
  { id: "0EGc2E3ItTw", title: "Baby" },
  { id: "Ji8chQmXeXU", title: "Human" },
  { id: "hBDK3g5438U", title: "Baby Seal" }
];

  function makeId() {
    if (crypto.randomUUID) {
      return crypto.randomUUID().replaceAll("-", "_");
    }
    return "id_" + Date.now() + "_" +
      Math.random().toString(36).slice(2) +
      Math.random().toString(36).slice(2);
  }

  function getStoredId(storage, key) {
    let id = storage.getItem(key);
    if (!id) {
      id = makeId();
      storage.setItem(key, id);
    }
    return id;
  }

  const visitorId = getStoredId(
    localStorage, "seal_visitor_id"
  );
  const sessionId = getStoredId(
    sessionStorage, "seal_session_id"
  );

  function getDeviceType() {
    const ua = navigator.userAgent;
    if (/iPad|Tablet|PlayBook|Silk/i.test(ua)) return "tablet";
    if (/Mobi|iPhone|Android/i.test(ua)) return "mobile";
    return "desktop";
  }

const deviceType = getDeviceType();

async function trackEvent(eventType, videoId = null) {
  if (
    !SUPABASE_PUBLISHABLE_KEY.startsWith("sb_publishable_")
  ) {
    console.warn("Vul eerst je Supabase publishable key in.");
    return;
  }

    try {
   const response = await fetch(
  `${SUPABASE_URL}/functions/v1/${FUNCTION_NAME}`,
  {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_PUBLISHABLE_KEY
    },
    body: JSON.stringify({
      visitor_id: visitorId,
      session_id: sessionId,
      event_type: eventType,
      video_id: videoId,
      device_type: deviceType
    })
  }
);

      if (!response.ok) {
        console.error(
          "Supabase registratie mislukt:",
          response.status,
          await response.text()
        );
      }
    } catch (error) {
      console.error("Supabase niet bereikbaar:", error);
    }
  }

  let previousIndex = -1;

  const card = document.getElementById("videoCard");
  const player = document.getElementById("player");

  function showRandomSeal() {
    let index;

    do {
      index = Math.floor(Math.random() * videos.length);
    } while (
      videos.length > 1 && index === previousIndex
    );

    previousIndex = index;
    const video = videos[index];

    // Registreer de klik en de gekozen video.
    trackEvent("click", video.id);

    const iframe = document.createElement("iframe");
    iframe.src =
      "https://www.youtube-nocookie.com/embed/" +
      video.id +
      "?autoplay=1&rel=0";

    iframe.title = video.title;
    iframe.allow =
      "accelerometer; autoplay; encrypted-media; " +
      "gyroscope; picture-in-picture; web-share";
    iframe.allowFullscreen = true;
    iframe.referrerPolicy = "strict-origin-when-cross-origin";

    player.replaceChildren(iframe);
    card.classList.add("visible");
  }

  document
    .getElementById("sealButton")
    .addEventListener("click", showRandomSeal);

  document
    .getElementById("closeVideo")
    .addEventListener("click", () => {
      card.classList.remove("visible");
      player.replaceChildren();
    });

  document
    .getElementById("anotherButton")
    .addEventListener("click", showRandomSeal);
</script>


</body>
</html>
